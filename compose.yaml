services:
  labelworks-mcp:
    build: .
    image: epson-labelworks-mcp:latest
    container_name: labelworks-mcp
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data

    # --- Bluetooth (LW_TRANSPORT=rfcomm) ---------------------------------
    # RFCOMM sockets need the host's Bluetooth stack: pair the printer on the
    # host with bluetoothctl first, then share the host network namespace.
    network_mode: host

    # --- USB (LW_TRANSPORT=usb) ------------------------------------------
    # Uncomment to pass the printer through instead of / as well as Bluetooth.
    # device_cgroup_rules:
    #   - "c 189:* rwm"
    # volumes:
    #   - ./data:/data
    #   - /dev/bus/usb:/dev/bus/usb
